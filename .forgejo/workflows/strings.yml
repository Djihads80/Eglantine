name: Check Strings

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  check-strings:
    # The runner labelled "source" belongs to eden-emu/eden; on a fork every push would queue a run
    # that nobody picks up, and the release page shows it as a failed check.
    if: github.repository == 'eden-emu/eden'
    runs-on: source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find Unused Strings
        run: ./tools/unused-strings.sh

      - name: Find Stale Translations
        run: ./tools/stale-translations.sh

      - name: Diff
        run: git --no-pager diff --exit-code HEAD
