name: tx-src

on:
  push:
    branches: [ master ]

jobs:
  sources:
    # Uploads the .ts sources to Eden's Transifex project; the runner labelled "source" belongs to
    # eden-emu/eden. Skipped on forks instead of queueing a run that is never picked up.
    if: github.repository == 'eden-emu/eden'
    runs-on: source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push New Sources
        run: |
          export PATH=/usr/lib/qt6/bin:$PATH
          ./tools/translations/qt-source.sh
          tx-cli push -s
