name: release-binaries

on:
  workflow_dispatch:
  push:
    branches:
      - nx2

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-mingw:
    name: windows-x86_64-mingw binary
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 \
            glslang-tools ninja-build p7zip-full pkg-config

      - name: Install Qt for MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtcharts
          cache: true
      
      - name: Install Qt host tools (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/qt-host
          set-env: false
          cache: true

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-mingw-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-mingw-
            cpm-${{ runner.os }}-
      
      - name: Build libiconv for MinGW
        shell: bash
        run: |
          curl -L https://ftpmirror.gnu.org/gnu/libiconv/libiconv-1.19.tar.gz | tar xz
          cd libiconv-1.19
          ./configure --host=x86_64-w64-mingw32 \
            --prefix=/usr/x86_64-w64-mingw32 \
            --enable-static --disable-shared
          make -j"$(nproc)"
          sudo make install

      - name: Configure Windows MinGW
        shell: bash
        env:
          CROSS_COMPILE: x86_64-w64-mingw32-
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=.github/mingw-w64-toolchain.cmake
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_FIND_ROOT_PATH="$QT_ROOT_DIR;/usr/x86_64-w64-mingw32"
          -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6"
          -DQT_HOST_PATH="${{ runner.temp }}/qt-host/Qt/6.8.3/gcc_64"
          -DYUZU_USE_BUNDLED_FFMPEG=ON
          -DMAKE=/usr/bin/make
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DVulkanHeaders_FORCE_BUNDLED=ON
          -DVulkanUtilityLibraries_FORCE_BUNDLED=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF

      - name: Build
        shell: bash
        run: cmake --build build/release --target yuzu --parallel

      - name: Package Windows MinGW binary
        shell: bash
        run: |
          test -f build/release/bin/eglantine.exe
          7z a "eglantine-${GITHUB_SHA}-windows-x86_64-mingw.zip" build/release/bin/eglantine.exe

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-windows-x86_64-mingw-${{ github.sha }}
          path: eglantine-${{ github.sha }}-windows-x86_64-mingw.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
