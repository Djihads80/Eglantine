name: gitleaks

on:
  push:
    branches:
      - nx2
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history so the weekly and manual runs scan every commit, not just the latest.
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pull requests: scan exactly base..head. gitleaks-action only looks at the first page of the
      # PR's commits through the API, so a long PR could skip commits.
      - name: Run gitleaks on the pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$PWD:/repo"\
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo\
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo\
            --config /repo/.github/gitleaks.toml --log-opts="${BASE_SHA}..${HEAD_SHA}"\
            --redact --verbose

      - name: Run gitleaks
        if: github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
