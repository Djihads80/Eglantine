name: ci

run-name: >-
  ci (${{ github.event_name }}${{ github.event_name == 'pull_request' && format(' #{0}', github.event.pull_request.number) || '' }})

# Entry point of every build. It decides what the run is (daily / rc / stable / branch), then calls
# one reusable workflow per OS and a final one that publishes the GitHub release.
#
#   push to nx2 touching VERSION   stable or rc release, aborted when that tag already exists
#   workflow_dispatch, kind=daily  daily build of the daily branch, started by daily.yml on nx2
#   workflow_dispatch              branch build of the chosen ref (or a daily, from the daily branch)
#   pull_request + ci:build label  branch build of a same-repo PR, rebuilt on each push
on:
  push:
    branches:
      - nx2
    paths:
      - VERSION
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      kind:
        description: What to build (daily is only allowed on the daily branch)
        type: choice
        options: [branch, daily]
        default: branch
      build_linux:
        description: Build Linux binaries
        type: boolean
        default: true
      build_windows:
        description: Build Windows binaries
        type: boolean
        default: true
      build_macos:
        description: Build macOS binaries
        type: boolean
        default: true
      pgo:
        description: Also build the PGO variants
        type: choice
        options: [none, both, only]
        default: none
      save_cache:
        description: Save the compiler and CPM caches at the end of the job (they are always restored)
        type: boolean
        default: false
      publish:
        description: Publish the binaries as a GitHub pre-release (otherwise only workflow artifacts)
        type: boolean
        default: true
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

# A running release or daily build is never cancelled: it finishes and publishes, and one newer run
# queues behind it. Branch builds are rolling, so a newer push replaces the one in progress.
concurrency:
  # Manual and scheduled daily builds share a group; PR and manual branch builds share a group
  # for the source branch so they cannot race while replacing the same rolling release.
  group: ci-${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || (github.event.action == 'labeled' && github.event.label.name != 'ci:build'))) && format('ignored-{0}', github.run_id) || (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.kind == 'daily')) && 'daily' || (github.event_name == 'pull_request' && format('branch-{0}', github.event.pull_request.head.ref)) || (github.event_name == 'workflow_dispatch' && format('branch-{0}', github.ref_name)) || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.kind != 'daily') }}

jobs:
  prepare:
    name: Prepare scheme
    if: >-
      github.event_name != 'pull_request' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'ci:build') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ci:build')
      )
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.scheme.outputs.kind }}
      tag: ${{ steps.scheme.outputs.tag }}
      title: ${{ steps.scheme.outputs.title }}
      version: ${{ steps.scheme.outputs.version }}
      display: ${{ steps.scheme.outputs.display }}
      display_pgo: ${{ steps.scheme.outputs.display_pgo }}
      display_store: ${{ steps.scheme.outputs.display_store }}
      display_pgo_store: ${{ steps.scheme.outputs.display_pgo_store }}
      refspec: ${{ steps.scheme.outputs.refspec }}
      sha: ${{ steps.scheme.outputs.sha }}
      skip: ${{ steps.scheme.outputs.skip }}
      prerelease: ${{ steps.scheme.outputs.prerelease }}
      nightly: ${{ steps.scheme.outputs.nightly }}
      publish: ${{ steps.scheme.outputs.publish }}
      prev_tag: ${{ steps.scheme.outputs.prev_tag }}
      branch: ${{ steps.scheme.outputs.branch }}
    steps:
      # Run the scheme helper from the trusted default branch. The target commit is fetched as
      # git data only; PR code must not control outputs that feed the write-enabled release job.
      - name: Check out trusted CI scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve build commit
        id: target
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DAILY_BRANCH: ${{ vars.DAILY_BRANCH || 'nx2-experimental' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            git fetch --no-tags origin "$DAILY_BRANCH:refs/remotes/origin/$DAILY_BRANCH"
            sha=$(git rev-parse "refs/remotes/origin/$DAILY_BRANCH")
          else
            git fetch --no-tags origin "$TARGET_SHA"
            sha="$TARGET_SHA"
          fi
          git cat-file -e "$sha^{commit}"
          # The VERSION file belongs to the source commit for a version-triggered push.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git show "$sha:VERSION" > VERSION
            git show "$sha:CHANGELOG.md" > CHANGELOG.md
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Prepare scheme
        id: scheme
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_KIND: ${{ inputs.kind }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BUILD_SHA: ${{ steps.target.outputs.sha }}
        run: bash tools/ci/prepare.sh

  linux:
    name: Linux
    needs: prepare
    if: >-
      needs.prepare.outputs.skip != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.build_linux)
    uses: ./.github/workflows/build-linux.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      display: ${{ needs.prepare.outputs.display }}
      display_pgo: ${{ needs.prepare.outputs.display_pgo }}
      refspec: ${{ needs.prepare.outputs.refspec }}
      tag: ${{ needs.prepare.outputs.tag }}
      release: ${{ needs.prepare.outputs.kind == 'stable' || needs.prepare.outputs.kind == 'rc' }}
      nightly: ${{ needs.prepare.outputs.nightly == 'true' }}
      pgo: ${{ inputs.pgo || (needs.prepare.outputs.kind == 'branch' && 'none' || 'both') }}
      save_cache: ${{ inputs.save_cache || (needs.prepare.outputs.kind == 'daily') }}

  windows:
    name: Windows
    needs: prepare
    if: >-
      needs.prepare.outputs.skip != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.build_windows)
    uses: ./.github/workflows/build-windows.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      display: ${{ needs.prepare.outputs.display }}
      display_pgo: ${{ needs.prepare.outputs.display_pgo }}
      refspec: ${{ needs.prepare.outputs.refspec }}
      tag: ${{ needs.prepare.outputs.tag }}
      release: ${{ needs.prepare.outputs.kind == 'stable' || needs.prepare.outputs.kind == 'rc' }}
      nightly: ${{ needs.prepare.outputs.nightly == 'true' }}
      pgo: ${{ inputs.pgo || (needs.prepare.outputs.kind == 'branch' && 'none' || 'both') }}
      save_cache: ${{ inputs.save_cache || (needs.prepare.outputs.kind == 'daily') }}

  macos:
    name: macOS
    needs: prepare
    if: >-
      needs.prepare.outputs.skip != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.build_macos)
    uses: ./.github/workflows/build-macos.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      display: ${{ needs.prepare.outputs.display }}
      refspec: ${{ needs.prepare.outputs.refspec }}
      tag: ${{ needs.prepare.outputs.tag }}
      release: ${{ needs.prepare.outputs.kind == 'stable' || needs.prepare.outputs.kind == 'rc' }}
      nightly: ${{ needs.prepare.outputs.nightly == 'true' }}
      runner: ${{ vars.MACOS_RUNNER || 'macos-26' }}
      save_cache: ${{ inputs.save_cache || (needs.prepare.outputs.kind == 'daily') }}

  # Nix will not gate a release and notifies
  # about a failure when non-Nix Nix-supported targets succeed
  # -> see nix-failure-notice
  nix:
    name: Nix
    needs: prepare
    # A push or a scheduled run builds every system. A manual run follows the
    # same Linux/macOS ticks that drive the other OS jobs, and is skipped
    # entirely when the operator asked for Windows only.
    # (There is no `platforms` input: per-OS booleans replaced it in
    # baa6d295ac, two days before the Nix workflows merged -- this job kept
    # reading the deleted one, so it always ran with `os: all`.)
    if: >-
      needs.prepare.outputs.skip != 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.build_linux || inputs.build_macos)
    uses: ./.github/workflows/build-nix.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      display: ${{ needs.prepare.outputs.display }}
      display_pgo: ${{ needs.prepare.outputs.display_pgo }}
      display_store: ${{ needs.prepare.outputs.display_store }}
      display_pgo_store: ${{ needs.prepare.outputs.display_pgo_store }}
      linux: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
      macos: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
      # Same identity inputs the linux job gets, so the Nix binary reports the
      # same version string as the release it sits next to.
      refspec: ${{ needs.prepare.outputs.refspec }}
      tag: ${{ needs.prepare.outputs.tag }}
      release: ${{ needs.prepare.outputs.kind == 'stable' || needs.prepare.outputs.kind == 'rc' }}
      nightly: ${{ needs.prepare.outputs.nightly == 'true' }}
      pgo: ${{ inputs.pgo || (needs.prepare.outputs.kind == 'branch' && 'none' || 'both') }}
      save_cache: ${{ inputs.save_cache || (needs.prepare.outputs.kind == 'daily') }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  nix-failure-notice:
    name: Nix failure notice
    needs: [linux, macos, nix]
    # Only speak up when Nix is the sole failure: every OS job that actually
    # ran must have passed, and at least one of them must have run (a
    # Windows-only dispatch skips both and never reaches here anyway).
    if: >-
      always() && needs.nix.result == 'failure' &&
      needs.linux.result != 'failure' &&
      needs.macos.result != 'failure' &&
      (needs.linux.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Announce the failure
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHA="${GITHUB_SHA::7}"
          # The annotation is the part that works with no setup at all.
          echo "::warning::Nix failed on ${GITHUB_REF_NAME} (${SHA}, ${GITHUB_EVENT_NAME}) on its own -- the other builds that ran passed, so this one is Nix's. Not release-blocking. ${URL}"
          # Same idiom as the release notice in release.yml, minus the role ping
          # and pointed at a dev channel's webhook instead of the public one.
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_DEV_WEBHOOK_URL secret, skipping."; exit 0; fi
          MSG=$(printf '## Nix CI failed on `%s` (%s) -- the other builds that ran passed\n%s' "${GITHUB_REF_NAME}" "${SHA}" "${URL}")
          jq -n --arg content "$MSG" '{content: $content}' |
            curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK" ||
            echo "::warning::Could not post the notice to Discord."
          exit 0

  # Publishes only when every OS that ran succeeded (skipped OSes don't count).
  release:
    name: Publish release
    needs: [prepare, linux, windows, macos]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.skip != 'true' &&
      needs.prepare.outputs.publish == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ github.event_name != 'pull_request' && secrets.DISCORD_WEBHOOK_URL || '' }}
    with:
      kind: ${{ needs.prepare.outputs.kind }}
      tag: ${{ needs.prepare.outputs.tag }}
      title: ${{ needs.prepare.outputs.title }}
      prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
      sha: ${{ needs.prepare.outputs.sha }}
      prev_tag: ${{ needs.prepare.outputs.prev_tag }}
      branch: ${{ needs.prepare.outputs.branch }}
      macos_runner: ${{ vars.MACOS_RUNNER || 'macos-26' }}
