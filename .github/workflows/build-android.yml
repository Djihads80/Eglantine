name: build-android

# Reusable: builds the arm64 mainline APK once per package name (the default
# dev.eglantine.eglantine_emulator, plus the optional com.ludashi.benchmark and
# com.antutu.ABenchMark) and uploads them as one artifact.
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: android-arm64
    runs-on: ubuntu-26.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
      # Gradle's .cxx build folders are named by a config hash; relative paths keep hits stable.
      CCACHE_BASEDIR: ${{ github.workspace }}
      SHA: ${{ inputs.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The runner image has the SDK; add the NDK, CMake and platform the Gradle build asks for,
      # and glslangValidator for the host shaders.
      - name: Install Android packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools ccache
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.5" > /dev/null

      - name: Cache CPM downloads
        uses: actions/cache@v6
        with:
          path: .cache/cpm
          key: cpm-android-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-android-

      - name: Cache compiler objects
        uses: actions/cache@v6
        with:
          path: .ccache
          key: objects-android-arm64-${{ inputs.sha }}
          restore-keys: |
            objects-android-arm64-

      - name: Build APKs
        shell: bash
        working-directory: src/android
        run: |
          set -euo pipefail
          # One build per package name; only the applicationId changes between them.
          for variant in "dev.eglantine.eglantine_emulator:" "com.ludashi.benchmark:-ludashi" "com.antutu.ABenchMark:-antutu"; do
            ./gradlew --no-daemon "-PappId=${variant%%:*}" "-PYUZU_ANDROID_ARGS=-DUSE_CCACHE=ON" \
              assembleMainlineRelease
            apk=$(find app/build/outputs/apk/mainline/release -name '*.apk' | head -1)
            cp "$apk" "$GITHUB_WORKSPACE/eglantine-${SHA}-android-arm64${variant#*:}.apk"
          done
          ccache --show-stats

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-android-arm64-${{ inputs.sha }}
          path: eglantine-${{ inputs.sha }}-android-arm64*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
