name: local-build

# Runs only when started by hand (Actions tab or `gh workflow run local-build.yml`), on the
# self-hosted runner from tools/local-runner.
on:
  workflow_dispatch:
    inputs:
      linux:
        description: Build Linux x86_64 (tar.gz and AppImage)
        type: boolean
        default: true
      android:
        description: Build the Android APK
        type: boolean
        default: true
      android_app_id:
        description: Android application id
        type: string
        default: com.antutu.ABenchMark
      release:
        description: Publish the results as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: local-build
  cancel-in-progress: false

jobs:
  linux:
    if: inputs.linux
    runs-on: [self-hosted, eglantine-local]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF -DUSE_CCACHE=ON

      - name: Build
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      - name: Package
        run: |
          set -euo pipefail
          name="eglantine-${GITHUB_SHA::10}-linux-x86_64"
          strip build/release/bin/eglantine build/release/bin/eden-cli
          tar -czf "$name.tar.gz" -C build/release/bin eglantine eden-cli
          rm -rf AppDir
          cp dist/Eglantine.png "$RUNNER_TEMP/dev.eglantine.eglantine.png"
          export APPIMAGE_EXTRACT_AND_RUN=1 NO_STRIP=1 ARCH=x86_64 QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LDAI_OUTPUT="$name.AppImage" OUTPUT="$name.AppImage"
          /opt/linuxdeploy/linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/release/bin/eglantine --executable build/release/bin/eden-cli \
            --desktop-file dist/dev.eden_emu.eden.desktop \
            --icon-file "$RUNNER_TEMP/dev.eglantine.eglantine.png" --plugin qt
          # AppRun is a symlink at the AppDir root: Qt looks for qt.conf next to it.
          printf '[Paths]\nPrefix = usr\nPlugins = plugins\n' > AppDir/qt.conf
          /opt/linuxdeploy/linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          ls -la "$name".*

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: eglantine-*-linux-x86_64.*
          compression-level: 0

  android:
    if: inputs.android
    runs-on: [self-hosted, eglantine-local]
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        working-directory: src/android
        run: |
          ./gradlew --no-daemon "-PappId=${{ inputs.android_app_id }}" assembleMainlineRelease
          apk=$(find app/build/outputs/apk/mainline/release -name '*.apk' | head -1)
          cp "$apk" "$GITHUB_WORKSPACE/eglantine-${GITHUB_SHA::10}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: eglantine-*-android.apk
          compression-level: 0

  release:
    if: inputs.release && !cancelled() && !failure()
    needs: [linux, android]
    runs-on: [self-hosted, eglantine-local]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="local-${GITHUB_SHA::10}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Eglantine ${GITHUB_SHA::10}" --notes "Built locally from ${GITHUB_SHA}."
