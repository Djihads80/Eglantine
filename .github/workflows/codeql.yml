name: codeql

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/codeql.yml"
  push:
    branches:
      - nx2
    paths:
      - "src/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL C/C++
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # build-mode none reads the sources without compiling the emulator, which keeps this to a few
      # minutes instead of a full build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - externals/
              - src/dynarmic/externals/
              - src/tests/

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
