name: build-macos

# Reusable: builds the macOS arm64 app bundle and uploads it as a zip and a dmg.
#
# Homebrew libraries built on a newer macOS can raise the app's effective minimum OS version.
# Set the MACOS_RUNNER repository variable to change the runner, then verify the resulting bundle
# without editing the workflows.
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      version:
        type: string
        required: true
      refspec:
        type: string
        required: true
      tag:
        type: string
        required: true
      release:
        type: boolean
        default: false
      nightly:
        type: boolean
        default: true
      runner:
        type: string
        # Might be changed to latest for more availability
        default: macos-15

permissions:
  contents: read

jobs:
  build:
    name: macos-arm64
    runs-on: ${{ inputs.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      PLATFORM: macos-arm64
      SHA: ${{ inputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup build from checked-out source
        if: hashFiles('.github/actions/setup-build/action.yml') != ''
        uses: ./.github/actions/setup-build
        with:
          platform: ${{ env.PLATFORM }}
          sha: ${{ inputs.sha }}
          refspec: ${{ inputs.refspec }}
          tag: ${{ inputs.tag }}
          release: ${{ inputs.release }}

      - name: Setup build from compatibility pin
        if: hashFiles('.github/actions/setup-build/action.yml') == ''
        uses: Djihads80/Eglantine/.github/actions/setup-build@5016e217b829b45fda263b05ee00560bd3656397
        with:
          platform: ${{ env.PLATFORM }}
          sha: ${{ inputs.sha }}
          refspec: ${{ inputs.refspec }}
          tag: ${{ inputs.tag }}
          release: ${{ inputs.release }}

      # The packages docs/Deps.md lists for macOS, plus ccache.
      - name: Install macOS dependencies
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install autoconf automake boost ffmpeg fmt glslang hidapi libtool libusb lz4 ninja \
            nlohmann-json openssl pkg-config qt@6 sdl3 speexdsp zlib zstd cmake catch2 molten-vk \
            vulkan-loader spirv-tools vulkan-utility-libraries ccache

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix qt@6);$(brew --prefix zlib)" \
            "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DNIGHTLY_BUILD=${{ inputs.nightly && 'ON' || 'OFF' }}

      - name: Build
        shell: bash
        run: |
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          ccache --show-stats

      # A self-contained app bundle: macdeployqt copies Qt and every other Homebrew library both
      # programs load into the bundle, then the leftover Homebrew search paths are removed so a
      # machine with Homebrew still uses the bundled copies. Ad-hoc signed, not notarized.
      - name: Package macOS app
        shell: bash
        run: |
          set -euo pipefail
          app=build/release/bin/eglantine.app
          test -x "$app/Contents/MacOS/eglantine"
          test -x build/release/bin/eden-cli
          for binary in "$app/Contents/MacOS/eglantine" build/release/bin/eden-cli; do
            test "$(lipo -archs "$binary")" = arm64
          done
          cp build/release/bin/eden-cli "$app/Contents/MacOS/eden-cli"
          "$(brew --prefix qt@6)/bin/macdeployqt" "$app" \
            -executable="$app/Contents/MacOS/eden-cli" -libpath="$(brew --prefix)/lib" \
            -always-overwrite -verbose=1
          # Qt's virtual keyboard input plugin pulls in the QML stack, which the emulator doesn't use.
          rm -f "$app/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin.dylib"
          binaries=$(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) \
            -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)
          for binary in $binaries; do
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              { grep -E '^/(opt/homebrew|usr/local)/' || true; } | while read -r rpath; do
                install_name_tool -delete_rpath "$rpath" "$binary" 2> /dev/null
              done
          done
          # Libraries that load their dependencies through @rpath find them in the bundle.
          for program in eglantine eden-cli; do
            install_name_tool -add_rpath @executable_path/../Frameworks \
              "$app/Contents/MacOS/$program" 2> /dev/null
          done
          leaks=$(for binary in $binaries; do
            otool -L "$binary" | grep -E '^\s+/(opt/homebrew|usr/local)/'
            otool -l "$binary" | awk '/cmd LC_RPATH/ {getline; getline; print $2}' |
              grep -E '^/(opt/homebrew|usr/local)/'
          done || true)
          if [ -n "$leaks" ]; then
            echo "References still pointing outside the bundle:"
            echo "$leaks" | sort -u
            exit 1
          fi
          # macdeployqt invalidates the signatures. The programs get the entitlements when the
          # tree has them (the Hypervisor CPU backend needs com.apple.security.hypervisor).
          codesign --force --deep --sign - "$app"
          if [ -f dist/eglantine.entitlements ]; then
            codesign --force --sign - --entitlements dist/eglantine.entitlements \
              "$app/Contents/MacOS/eden-cli"
            codesign --force --sign - --entitlements dist/eglantine.entitlements "$app"
          fi
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "eglantine-${SHA}-${PLATFORM}.zip"
          ls -la "eglantine-${SHA}-${PLATFORM}.zip"
          # Also ship a .dmg (drag eglantine.app onto Applications).
          dmgdir=$(mktemp -d)
          ditto "$app" "$dmgdir/eglantine.app"
          ln -s /Applications "$dmgdir/Applications"
          hdiutil create -volname "Eglantine" -srcfolder "$dmgdir" -ov -format UDZO \
            "eglantine-${SHA}-${PLATFORM}.dmg"
          ls -la "eglantine-${SHA}-${PLATFORM}.dmg"

      # Zipped with ditto beforehand: the bundle's framework symlinks don't survive artifact zipping.
      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-${{ env.PLATFORM }}-${{ inputs.sha }}
          path: |
            eglantine-${{ inputs.sha }}-${{ env.PLATFORM }}.zip
            eglantine-${{ inputs.sha }}-${{ env.PLATFORM }}.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
