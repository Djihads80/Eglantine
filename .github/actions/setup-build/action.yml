name: Setup build
description: >-
  Writes the GIT-* files GetSCMRev reads (so the build embeds the version this run was given instead
  of asking git), exports the compiler-cache environment, and restores the CPM and compiler-object
  caches. Run after actions/checkout.

inputs:
  platform:
    description: Platform name, used in the compiler cache key (for example linux-x86_64-pgo)
    required: true
  sha:
    description: Full commit SHA being built
    required: true
  refspec:
    description: Value for GIT-REFSPEC (the version label of a daily or branch build)
    required: true
  tag:
    description: Value for GIT-TAG
    required: true
  release:
    description: "true for stable and rc builds: writes GIT-RELEASE, which makes the build a release build"
    required: false
    default: "false"
  display:
    description: >-
      Human-facing build identity for this leg, composed by prepare (see
      tools/ci/display-version.sh). Written as GIT-DISPLAY; empty means the caller had none and
      the binary falls back to its own version string.
    required: false
    default: ""
  save-cache:
    description: >-
      Force-save the caches at the end of the job (they are always restored). Saving otherwise
      happens only on refs/heads/nx2 and on daily builds (ci.yml maps kind=daily onto this input,
      because a daily is a dispatch now, not a schedule event) - see "Decide cache saving".
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Write SCM files
      shell: bash
      env:
        SCM_SHA: ${{ inputs.sha }}
        SCM_REFSPEC: ${{ inputs.refspec }}
        SCM_TAG: ${{ inputs.tag }}
        SCM_RELEASE: ${{ inputs.release }}
        SCM_DISPLAY: ${{ inputs.display }}
      run: |
        set -euo pipefail
        printf '%s\n' "$SCM_SHA" > GIT-COMMIT
        printf '%s\n' "$SCM_REFSPEC" > GIT-REFSPEC
        printf '%s\n' "$SCM_TAG" > GIT-TAG
        if [ "$SCM_RELEASE" = true ]; then
          printf '%s\n' "$SCM_TAG" > GIT-RELEASE
        else
          rm -f GIT-RELEASE
        fi
        # The string every user sees in the title bar and the About dialog. It is
        # empty when the caller has none (a local build, an old CI pin), and the
        # binary then falls back to the version it composes from the files above.
        if [ -n "$SCM_DISPLAY" ]; then
          printf '%s\n' "$SCM_DISPLAY" > GIT-DISPLAY
        else
          rm -f GIT-DISPLAY
        fi
        echo "GetSCMRev inputs:"
        head -v GIT-COMMIT GIT-REFSPEC GIT-TAG GIT-RELEASE GIT-DISPLAY 2> /dev/null || true

    # One definition of the compiler-cache environment, for every platform and every ref.
    # ccache hashes these settings into every key, so a platform (or a branch) that sets them
    # differently cannot read another's objects: it restores a cache and misses all of it, in both
    # direct and preprocessed mode. Keep them here, not in the workflow files.
    #   COMPILERCHECK=content  identify the compiler by hashing the binary, not by its mtime, so a
    #                          rebuilt runner image does not invalidate the whole cache
    #   BASEDIR                rewrite paths under the workspace to relative ones before hashing
    #   NOHASHDIR              keep the working directory out of the key
    - name: Compiler cache environment
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache"
          echo "CCACHE_MAXSIZE=1000M"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_BASEDIR=${{ github.workspace }}"
          echo "CCACHE_NOHASHDIR=true"
        } >> "$GITHUB_ENV"

    # Saving is a cost and a budget decision: every saving run writes a fresh entry (actions/cache
    # never overwrites a key), caches are scoped to the ref that wrote them, and the repository
    # shares one 10 GB pool. So by default the canonical producers save and everyone else only
    # restores - plus an explicit opt-in, so a branch with a changed configuration can warm itself
    # instead of staying cold until it merges.
    - name: Decide cache saving
      shell: bash
      run: |
        set -euo pipefail
        save=false
        if [ '${{ inputs.save-cache }}' = 'true' ] ||
           [ '${{ github.ref }}' = 'refs/heads/nx2' ]; then
          save=true
        fi
        echo "CACHE_SAVE=$save" >> "$GITHUB_ENV"
        echo "compiler cache will be saved: $save"

    - name: Cache CPM downloads (restore and save)
      if: env.CACHE_SAVE == 'true'
      uses: actions/cache@v6
      with:
        path: .cache/cpm
        key: cpm-v1-${{ runner.os }}-${{ hashFiles('**/cpmfile.json') }}
        restore-keys: |
          cpm-v1-${{ runner.os }}-

    - name: Cache CPM downloads (restore only)
      if: env.CACHE_SAVE != 'true'
      uses: actions/cache/restore@v6
      with:
        path: .cache/cpm
        key: cpm-v1-${{ runner.os }}-${{ hashFiles('**/cpmfile.json') }}
        restore-keys: |
          cpm-v1-${{ runner.os }}-

    # --- Compiler objects (ccache or sccache, whichever the job uses) ---
    # The "-" after the platform stops linux-x86_64 from matching linux-x86_64-pgo.
    # The action's own hash means a ref running a different cache configuration computes a
    # different name: it then reports "cache not found" (cold, and honestly labelled) instead of
    # restoring an entry it cannot use and compiling everything while printing "cache restored".
    # The sha makes every saving run write a fresh entry; restore-keys seeds it from the newest.
    - name: Cache compiler objects (restore and save)
      if: env.CACHE_SAVE == 'true'
      uses: actions/cache@v6
      with:
        path: |
          .ccache
          .sccache
        key: objects-v2-${{ inputs.platform }}-${{ hashFiles('.github/actions/setup-build/action.yml') }}-${{ inputs.sha }}
        restore-keys: |
          objects-v2-${{ inputs.platform }}-${{ hashFiles('.github/actions/setup-build/action.yml') }}-

    - name: Cache compiler objects (restore only)
      if: env.CACHE_SAVE != 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          .ccache
          .sccache
        key: objects-v2-${{ inputs.platform }}-${{ hashFiles('.github/actions/setup-build/action.yml') }}-${{ inputs.sha }}
        restore-keys: |
          objects-v2-${{ inputs.platform }}-${{ hashFiles('.github/actions/setup-build/action.yml') }}-
